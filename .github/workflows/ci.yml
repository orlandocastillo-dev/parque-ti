name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger GitHubActions --logger "trx;LogFileName=pruebas.trx" --results-directory resultados
      - name: Conteo de pruebas
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("resultados/**/*.trx", recursive=True):
              c = ET.parse(f).getroot().find(".//{*}Counters").attrib
              print(f"::notice title=Pruebas::{c['passed']} de {c['total']} pasaron ({c['failed']} fallaron)")
          PY
      - name: Imagen de Docker (la misma que usa Render)
        run: docker build -t parque-ti-api .
